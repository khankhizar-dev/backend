debug: false

spring:
  application:
    name: trippoint-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/trippoint
    username: trippoint
    password: trippoint
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  trippoint:
    document:
      storage-path: ./storage/documents

  jackson:
    time-zone: Asia/Kolkata
    default-property-inclusion: non_null

  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    web-socket:
      path: /graphql/ws
    http:
      path: /graphql

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8081