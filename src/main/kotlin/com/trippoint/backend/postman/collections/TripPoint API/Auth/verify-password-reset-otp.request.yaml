$kind: graphql-request
name: Verify Password Reset OTP
order: 10000
url: '{{baseUrl}}/graphql'
auth:
  type: noauth
query: |-
  mutation VerifyPasswordResetOtp($input: VerifyPasswordResetOtpRequest!) {
    verifyPasswordResetOtp(input: $input)
  }
variables: |-
  {
    "input": {
      "email": "user@example.com",
      "otp": "123456"
    }
  }
