$kind: graphql-request
name: Reset Password
order: 11000
url: '{{baseUrl}}/graphql'
auth:
  type: noauth
query: |-
  mutation ResetPassword($input: ResetPasswordRequest!) {
    resetPassword(input: $input)
  }
variables: |-
  {
    "input": {
      "email": "user@example.com",
      "otp": "123456",
      "newPassword": "newPassword123"
    }
  }
