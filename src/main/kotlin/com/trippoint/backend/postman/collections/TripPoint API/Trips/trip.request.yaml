$kind: graphql-request
name: Get Trip
order: 2000
url: '{{baseUrl}}/graphql'
query: |-
  query Trip($id: ID!) {
    trip(id: $id) {
      id
      ownerId
      name
      destination
      startDate
      endDate
      status
      progress
      travelers
      createdAt
      updatedAt
    }
  }
variables: |-
  {
    "id": "{{tripId}}"
  }
