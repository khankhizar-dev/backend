$kind: http-request
name: Me
method: POST
url: '{{baseUrl}}/graphql'
order: 3000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: json
  content: |-
    {
      "query": "query Me { me { id email firstName lastName } }",
      "variables": {}
    }
