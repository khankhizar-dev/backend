$kind: http-request
name: Login
method: POST
url: '{{baseUrl}}/graphql'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "mutation Login($email: String!, $password: String!) { login(email: $email, password: $password) { user { id email firstName lastName } token refreshToken } }",
      "variables": {
        "email": "user@example.com",
        "password": "password123"
      }
    }
